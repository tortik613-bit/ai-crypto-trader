[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-crypto-trader"
version = "0.2.0"
description = "Bybit spot swing-trading research and paper-trading starter"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pandas>=2.1", "numpy>=1.26", "typer>=0.12", "rich>=13.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
crypto-trader = "crypto_trader.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
